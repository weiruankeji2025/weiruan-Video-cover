<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集成测试 - 威软视频封面提取器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .test-section {
            background: #f8f9ff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .progress {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }
        .summary h3 {
            margin-top: 0;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 威软视频封面提取器 - 集成测试</h1>
        <p class="subtitle">完整功能测试套件</p>

        <div class="test-section">
            <h2>📋 测试配置</h2>
            <div class="test-result info">
                <strong>最大文件限制:</strong> 4 GB (4,294,967,296 字节)<br>
                <strong>测试用例:</strong> 11 个<br>
                <strong>测试内容:</strong> 文件大小验证逻辑
            </div>
        </div>

        <div class="test-section">
            <h2>🚀 快速测试</h2>
            <button onclick="runAllTests()">运行所有测试</button>
            <button onclick="runQuickTest()">快速测试</button>
            <button onclick="clearResults()">清除结果</button>

            <div id="progress" style="display: none;">
                <div class="progress">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
            </div>
        </div>

        <div id="testResults"></div>

        <div id="summary" style="display: none;"></div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        // 文件大小常量
        const MAX_FILE_SIZE = 4 * 1024 * 1024 * 1024; // 4GB
        const MB = 1024 * 1024;
        const GB = 1024 * 1024 * 1024;

        let testResults = [];

        /**
         * 格式化文件大小
         */
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        /**
         * 验证文件大小（模拟 video.js 的逻辑）
         */
        function validateFileSize(fileSize) {
            // 模拟实际代码的验证逻辑
            const maxSize = 4 * 1024 * 1024 * 1024;

            if (fileSize <= 0) {
                return {
                    valid: false,
                    message: '文件大小无效'
                };
            }

            if (fileSize > maxSize) {
                return {
                    valid: false,
                    message: `视频文件不能超过 4GB`
                };
            }

            return {
                valid: true,
                message: '文件大小符合要求'
            };
        }

        /**
         * 运行单个测试
         */
        function runTest(testCase) {
            const result = validateFileSize(testCase.size);
            const passed = result.valid === testCase.expected;

            return {
                name: testCase.name,
                size: testCase.size,
                sizeFormatted: formatFileSize(testCase.size),
                expected: testCase.expected,
                actual: result.valid,
                passed: passed,
                message: result.message
            };
        }

        /**
         * 显示进度
         */
        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
        }

        /**
         * 运行所有测试
         */
        async function runAllTests() {
            const resultsDiv = document.getElementById('testResults');
            const summaryDiv = document.getElementById('summary');
            const progressDiv = document.getElementById('progress');

            // 清空之前的结果
            testResults = [];
            resultsDiv.innerHTML = '<h2>🧪 测试执行中...</h2>';
            summaryDiv.style.display = 'none';
            progressDiv.style.display = 'block';
            updateProgress(0);

            // 定义测试用例
            const testCases = [
                { name: '零字节文件', size: 0, expected: false },
                { name: '1 KB 文件', size: 1024, expected: true },
                { name: '10 MB 文件', size: 10 * MB, expected: true },
                { name: '100 MB 文件', size: 100 * MB, expected: true },
                { name: '500 MB 文件', size: 500 * MB, expected: true },
                { name: '1 GB 文件', size: 1 * GB, expected: true },
                { name: '2 GB 文件', size: 2 * GB, expected: true },
                { name: '3 GB 文件', size: 3 * GB, expected: true },
                { name: '4 GB 文件 (边界)', size: 4 * GB, expected: true },
                { name: '4 GB + 1 字节', size: 4 * GB + 1, expected: false },
                { name: '5 GB 文件', size: 5 * GB, expected: false },
            ];

            let html = '<h2>📊 测试结果</h2>';
            let passCount = 0;
            let failCount = 0;

            // 逐个运行测试
            for (let i = 0; i < testCases.length; i++) {
                const testCase = testCases[i];
                const result = runTest(testCase);
                testResults.push(result);

                if (result.passed) {
                    passCount++;
                } else {
                    failCount++;
                }

                const statusClass = result.passed ? 'success' : 'error';
                const statusIcon = result.passed ? '✅' : '❌';

                html += `
                    <div class="test-result ${statusClass}">
                        <strong>${statusIcon} ${result.name}</strong><br>
                        文件大小: ${result.sizeFormatted} (${result.size.toLocaleString()} 字节)<br>
                        预期: ${result.expected ? '通过' : '拒绝'} |
                        实际: ${result.actual ? '通过' : '拒绝'}<br>
                        消息: ${result.message}
                    </div>
                `;

                // 更新进度
                const progress = Math.round((i + 1) / testCases.length * 100);
                updateProgress(progress);

                // 等待一小段时间让用户看到进度
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            resultsDiv.innerHTML = html;
            progressDiv.style.display = 'none';

            // 显示摘要
            const successRate = Math.round(passCount / testCases.length * 100);
            const summaryClass = failCount === 0 ? 'success' : 'error';

            summaryDiv.innerHTML = `
                <h3>📈 测试摘要</h3>
                <div style="font-size: 18px;">
                    <strong>总测试数:</strong> ${testCases.length}<br>
                    <strong>通过:</strong> ${passCount} ✅<br>
                    <strong>失败:</strong> ${failCount} ❌<br>
                    <strong>成功率:</strong> ${successRate}%<br>
                    <br>
                    <strong>状态:</strong> ${failCount === 0 ? '🎉 所有测试通过！' : '⚠️ 存在测试失败'}
                </div>
            `;
            summaryDiv.style.display = 'block';

            // 控制台输出
            console.log('测试完成:', { passCount, failCount, successRate });
        }

        /**
         * 快速测试（只测试关键用例）
         */
        async function runQuickTest() {
            const resultsDiv = document.getElementById('testResults');
            const summaryDiv = document.getElementById('summary');

            resultsDiv.innerHTML = '<h2>⚡ 快速测试</h2>';
            summaryDiv.style.display = 'none';

            const quickTests = [
                { name: '100 MB - 应该通过', size: 100 * MB, expected: true },
                { name: '1 GB - 应该通过', size: 1 * GB, expected: true },
                { name: '4 GB - 应该通过', size: 4 * GB, expected: true },
                { name: '5 GB - 应该拒绝', size: 5 * GB, expected: false },
            ];

            let html = '';
            let allPassed = true;

            for (const testCase of quickTests) {
                const result = runTest(testCase);
                const statusClass = result.passed ? 'success' : 'error';
                const statusIcon = result.passed ? '✅' : '❌';

                if (!result.passed) allPassed = false;

                html += `
                    <div class="test-result ${statusClass}">
                        <strong>${statusIcon} ${result.name}</strong><br>
                        ${result.sizeFormatted} → ${result.message}
                    </div>
                `;

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            resultsDiv.innerHTML = '<h2>⚡ 快速测试结果</h2>' + html;

            summaryDiv.innerHTML = `
                <h3>${allPassed ? '🎉 快速测试通过' : '⚠️ 快速测试失败'}</h3>
                <p>${allPassed ? '关键功能正常' : '请运行完整测试以查看详情'}</p>
            `;
            summaryDiv.style.display = 'block';
        }

        /**
         * 清除结果
         */
        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
            testResults = [];
        }

        // 页面加载时显示信息
        console.log('集成测试页面已加载');
        console.log('当前文件大小限制:', formatFileSize(MAX_FILE_SIZE));
        console.log('限制值（字节）:', MAX_FILE_SIZE);
    </script>
</body>
</html>
